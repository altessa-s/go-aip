syntax = "proto3";
package fieldbehaviortest.v1;

option java_package = "io.altessa.grpc.fieldbehaviortest.v1";
option java_multiple_files = true;
option go_package = "github.com/altessa-s/go-aip/internal/proto/gen/fieldbehaviortest/v1;fieldbehaviortestv1";

import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";

// Resource exercises every google.api.field_behavior value plus a few fields
// without annotations. It is consumed by the fieldbehavior, fieldmask and
// internal/behavior test suites.
message Resource {
  // IDENTIFIER: server-minted ID. Stripped from Create payloads, kept on Update
  // where it addresses the resource (AIP-203).
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];

  // REQUIRED: caller must supply on writes. Never stripped.
  string name = 2 [(google.api.field_behavior) = REQUIRED];

  // IMMUTABLE: set on Create, cannot be modified on Update.
  string tenant_id = 3 [(google.api.field_behavior) = IMMUTABLE];

  // OUTPUT_ONLY: server-managed; stripped from request payloads.
  string create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // INPUT_ONLY: accepted on input, stripped from response payloads.
  string password = 5 [(google.api.field_behavior) = INPUT_ONLY];

  // No annotation: plain field, never stripped.
  string description = 6;

  // Nested message without annotation: traversed recursively.
  Profile profile = 7;

  // Nested message with OUTPUT_ONLY: cleared as a whole, not traversed.
  Profile audit = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Repeated of messages: traversed per element.
  repeated Profile aliases = 9;

  // Map<string, Message>: traversed per value.
  map<string, Profile> labels = 10;

  // Repeated with field-level OUTPUT_ONLY: entire list cleared.
  repeated string tags = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Map with field-level OUTPUT_ONLY: entire map cleared.
  map<string, string> server_meta = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Oneof with INPUT_ONLY on the secret variant.
  oneof source {
    string source_url = 20;
    string source_token = 21 [(google.api.field_behavior) = INPUT_ONLY];
  }

  // Field with multiple behaviors (REQUIRED + IMMUTABLE).
  string slug = 30 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
}

// UpdateResourceRequest mirrors the AIP-134 update RPC shape: a resource
// payload paired with an update_mask. Consumed by the fieldmask extraction
// tests.
message UpdateResourceRequest {
  // The resource to update. Annotated as REQUIRED so the validation surface
  // matches what real services declare.
  Resource resource = 1 [(google.api.field_behavior) = REQUIRED];

  // Field mask listing which fields of resource should be updated. Per
  // AIP-134 the mask is required on the wire even though absent masks have
  // a defined fallback behavior.
  google.protobuf.FieldMask update_mask = 2;
}

// GetResourceRequest mirrors the AIP-157 read RPC shape: a resource name
// paired with a read_mask. Consumed by the fieldmask extraction tests.
message GetResourceRequest {
  // Resource name (routing key).
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Field mask listing which fields of the response should be returned.
  google.protobuf.FieldMask read_mask = 2;
}

// NestedUpdateResourceRequest exercises the non-canonical AIP-134 shape
// where the update_mask is nested inside an Options sub-message. Consumed
// by the fieldmask tests of custom extractors.
message NestedUpdateResourceRequest {
  message Options {
    // Field mask listing which fields of resource should be updated.
    google.protobuf.FieldMask update_mask = 1;
  }

  // The resource to update.
  Resource resource = 1 [(google.api.field_behavior) = REQUIRED];

  // Per-call options carrying the update_mask.
  Options options = 2;
}

// NestedGetResourceRequest exercises the non-canonical AIP-157 shape where
// the read_mask is nested inside an Options sub-message.
message NestedGetResourceRequest {
  message Options {
    // Field mask listing which fields of the response should be returned.
    google.protobuf.FieldMask read_mask = 1;
  }

  // Resource name (routing key).
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Per-call options carrying the read_mask.
  Options options = 2;
}

// Profile is a nested message with its own field_behavior annotations.
message Profile {
  // Nested IDENTIFIER (e.g. profile.id is server-set).
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];

  // No annotation.
  string display_name = 2;

  // Nested OUTPUT_ONLY.
  string updated_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Nested INPUT_ONLY (e.g. an auth token).
  string secret = 4 [(google.api.field_behavior) = INPUT_ONLY];
}

// State is the lifecycle of an Account; its zero value is falsy for REQUIRED.
enum State {
  STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
}

// Account exercises REQUIRED validation over every field shape, IMMUTABLE and
// IDENTIFIER comparison with a stored value at every depth, and update-mask
// expansion of messages that hold server-managed fields. Consumed by the
// fieldbehavior and fieldmask suites.
message Account {
  // IDENTIFIER: the resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // REQUIRED scalars and enum without presence: the zero value is empty.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  bytes key = 3 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 4 [(google.api.field_behavior) = REQUIRED];
  State state = 5 [(google.api.field_behavior) = REQUIRED];

  // REQUIRED scalar with explicit presence: a set zero is still empty.
  optional int32 quota = 6 [(google.api.field_behavior) = REQUIRED];

  // REQUIRED message, list and map.
  Owner owner = 7 [(google.api.field_behavior) = REQUIRED];
  repeated string emails = 8 [(google.api.field_behavior) = REQUIRED];
  map<string, string> attributes = 9 [(google.api.field_behavior) = REQUIRED];

  // Optional sub-message: its REQUIRED fields apply only when it is present.
  Owner backup_owner = 10;

  // Collections of messages with REQUIRED and IMMUTABLE fields.
  repeated Owner members = 11;
  map<string, Owner> delegates = 12;

  // Oneof with a REQUIRED member: satisfied by any member.
  oneof billing {
    string card = 13 [(google.api.field_behavior) = REQUIRED];
    string invoice_email = 14;
  }

  // IMMUTABLE: compared with the stored value on update.
  string region = 15 [(google.api.field_behavior) = IMMUTABLE];

  // OUTPUT_ONLY: cleared from requests, ignored in update masks.
  string update_time = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // AIP-154 etag: no field behavior.
  string etag = 17;

  // Sub-message holding only OUTPUT_ONLY fields, recursively.
  Settings settings = 18;

  // Recursive message holding IMMUTABLE, IDENTIFIER and OUTPUT_ONLY fields.
  Account parent = 19;

  // OUTPUT_ONLY and IMMUTABLE together: OUTPUT_ONLY governs.
  string uid = 20 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

// Owner is a nested message with REQUIRED, IMMUTABLE and OUTPUT_ONLY fields.
message Owner {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  string org = 2 [(google.api.field_behavior) = IMMUTABLE];
  string note = 3;
  string create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Settings holds only OUTPUT_ONLY server-managed fields, also through its
// recursive defaults field.
message Settings {
  string theme = 1;
  string updated_by = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  Settings defaults = 3;
}
