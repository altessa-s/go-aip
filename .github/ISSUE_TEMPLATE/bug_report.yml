name: Bug Report
description: Report a bug in go-aip
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`
      placeholder: "go1.27.0 linux/amd64"
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: go-aip Version
      description: The version or commit SHA of go-aip you are using.
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package is affected?
      options:
        - aip
        - apierror
        - apierror/aipmap
        - backend/clickhouse
        - backend/clickhouse/clickhousetest
        - backend/lua
        - backend/mariadb
        - backend/mariadb/mariadbtest
        - backend/meili
        - backend/memory
        - backend/mongo
        - backend/mongo/mongotest
        - backend/postgres
        - backend/postgres/postgrestest
        - backend/redis
        - backend/sqlbase
        - backend/sqlbase/sqlbasetest
        - backend/sqlbase/sqltype
        - batch
        - decimal128
        - etag
        - fieldbehavior
        - fieldinfo
        - fieldmask
        - fieldmask/extract
        - fieldmask/update
        - fieldpolicy
        - filter
        - filter/evaluator
        - filter/filtertest
        - filter/functions
        - filter/internal/regexcache
        - filter/parser
        - filter/regexanchor
        - integration/crossbackend
        - integration/docker
        - internal/behavior
        - internal/literalvalue
        - internal/lru
        - internal/maskmerge
        - internal/maskpath
        - internal/maskwalk
        - internal/proto
        - internal/telemetry
        - internal/testhelpers
        - internal/typename
        - listing
        - listing/evaluation
        - listing/listingtest
        - metrics
        - orderby
        - orderby/orderbytest
        - pagination/page
        - pagination/pagetoken
        - pagination/pagetoken/pagetokentest
        - projection
        - projection/projectiontest
        - projection/protopath
        - requestid
        - requestid/requestidtest
        - resourcename
        - softdelete
        - state
        - unreachable
        - validateonly
        - devtools
        - ci
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Create a ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages and stack traces if applicable.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots.
    validations:
      required: false
