name: Feature Request
description: Suggest a new feature or enhancement for go-aip
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the sections below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: A clear description of the problem this feature would solve.
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like, including API sketches if applicable.
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package would this feature belong to?
      options:
        - aip
        - apierror
        - apierror/aipmap
        - backend/clickhouse
        - backend/clickhouse/clickhousetest
        - backend/lua
        - backend/mariadb
        - backend/mariadb/mariadbtest
        - backend/meili
        - backend/memory
        - backend/mongo
        - backend/mongo/mongotest
        - backend/postgres
        - backend/postgres/postgrestest
        - backend/redis
        - backend/sqlbase
        - backend/sqlbase/sqlbasetest
        - backend/sqlbase/sqltype
        - batch
        - decimal128
        - etag
        - fieldbehavior
        - fieldinfo
        - fieldmask
        - fieldmask/extract
        - fieldmask/internal/maskpath
        - fieldmask/internal/maskwalk
        - fieldmask/update
        - fieldpolicy
        - filter
        - filter/evaluator
        - filter/filtertest
        - filter/functions
        - filter/internal/regexcache
        - filter/parser
        - filter/regexanchor
        - integration/crossbackend
        - integration/docker
        - internal/behavior
        - internal/literalvalue
        - internal/lru
        - internal/proto
        - internal/telemetry
        - internal/testhelpers
        - internal/typename
        - listing
        - listing/evaluation
        - listing/listingtest
        - metrics
        - orderby
        - orderby/orderbytest
        - pagination/page
        - pagination/pagetoken
        - pagination/pagetoken/pagetokentest
        - projection
        - projection/projectiontest
        - projection/protopath
        - requestid
        - requestid/requestidtest
        - resourcename
        - softdelete
        - state
        - unreachable
        - validateonly
        - devtools
        - ci
        - new package
        - not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, references, or screenshots.
    validations:
      required: false
